name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, curl
          coverage: none
      - name: Lint
        run: for f in *.php src/*.php tests/*.php; do php -l "$f"; done
      - name: Run tests
        run: bash tests/run.sh
